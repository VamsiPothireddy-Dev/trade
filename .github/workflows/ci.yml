name: CI

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: vamsipothireddy/trade
  INFRA_REPO: VamsiPothireddy-Dev/k8-infra
  CHART_REPO: VamsiPothireddy-Dev/helm-charts
  CHART_PATH: services/services
  # App config rendered into the manifests via --set flags below.
  APP_NAME: trade
  APP_DIR: apps/trade
  ISTIO_HOST: api.vamsipothireddy.com

jobs:
  ensure-infra-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Create infra repo if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh repo view "$INFRA_REPO" >/dev/null 2>&1; then
            echo "$INFRA_REPO already exists, skipping"
          else
            gh repo create "$INFRA_REPO" --private \
              --description "Kubernetes manifests for EKS (ArgoCD)"
          fi

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-infra:
    needs: [ensure-infra-repo, build-and-push]
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Clone chart and infra repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${CHART_REPO}.git" chart-repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${INFRA_REPO}.git" infra
          mkdir -p "infra/$APP_DIR/manifests"

      - name: Render manifests with helm template
        run: |
          IMAGE_TAG="${IMAGE_TAG:0:11}"  # sha- + 7-char short sha, matches Docker tag
          for tpl in deployment.yaml service.yml virtualservice.yaml; do
            helm template "$APP_NAME" "./chart-repo/$CHART_PATH" \
              --namespace default \
              --set "appName=${APP_NAME}-service" \
              --set replicaCount=2 \
              --set "image.repository=$IMAGE_NAME" \
              --set-string "image.tag=$IMAGE_TAG" \
              --set "service.type=ClusterIP" \
              --set "service.port=8000" \
              --set "service.targetPort=8000" \
              --set "istio.enabled=true" \
              --set "istio.host=$ISTIO_HOST" \
              --set "istio.gateway=istio-system/ingressgateway" \
              -s "templates/$tpl" \
              > "infra/$APP_DIR/manifests/${tpl%.yml}.yaml"
          done
          grep -n 'image:' "infra/$APP_DIR/manifests/deployment.yaml"

      - name: Write ArgoCD Application manifest
        run: |
          cat > "infra/$APP_DIR/application.yaml" <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: $APP_NAME
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/$INFRA_REPO.git
              targetRevision: HEAD
              path: $APP_DIR/manifests
            destination:
              server: https://kubernetes.default.svc
              namespace: default
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
          EOF

      - name: Commit and push manifests
        working-directory: infra
        run: |
          IMAGE_TAG="${IMAGE_TAG:0:11}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR"
          if git diff --cached --quiet; then
            echo "Manifests unchanged, nothing to push"
          else
            git commit -m "chore: deploy $APP_NAME image $IMAGE_TAG"
            git push
          fi
